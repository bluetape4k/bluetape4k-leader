name: CodeQL Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Pin Kotlin for CodeQL extractor
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail

          catalog_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path

          settings = Path("settings.gradle.kts").read_text()
          match = re.search(r'\.orElse\("([0-9a-f]{40}|[0-9a-f]{64})"\)', settings)
          if not match:
              raise SystemExit("could not find the immutable dependency-catalog ref")
          print(match.group(1))
          PY
          )"
          catalog="$RUNNER_TEMP/bluetape4k-dependencies-libs.versions.toml"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/${catalog_ref}/gradle/libs.versions.toml" \
            --output "$catalog"
          grep -Eq '^kotlin[[:space:]]*=[[:space:]]*"2\.4\.0"' "$catalog"
          sed -Ei 's/^(kotlin[[:space:]]*=[[:space:]]*)"2\.4\.0"/\1"2.3.21"/' "$catalog"
          grep -En '^kotlin[[:space:]]*=[[:space:]]*"2\.3\.21"' "$catalog"
          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_PATH=$catalog" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        if: matrix.language == 'java-kotlin'
        run: ./gradlew build -x test -x koverVerify --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
