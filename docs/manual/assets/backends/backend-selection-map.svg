<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Pick the Backend You Can Operate</title><desc id="desc">Backend selection map across Redis, SQL, document, control-plane, and cluster coordination families.</desc>
  <defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.58" stop-color="#152235"/><stop offset="1" stop-color="#213149"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.38"/></filter>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.2"/></filter>
  <marker id="arrow-cyan" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#5eead4" stroke="#5eead4"/>
</marker>
<marker id="arrow-purple" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#c4b5fd" stroke="#c4b5fd"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#f6c96b" stroke="#f6c96b"/>
</marker>
<marker id="arrow-rose" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#fda4af" stroke="#fda4af"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="url(#canvas)"/>
  <rect x="42" y="34" width="1516" height="972" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="48" font-weight="700" fill="#f8fafc"><tspan x="800" y="96">Pick the Backend You Can Operate</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#b6c4d6"><tspan x="800" y="137">selection is an ownership and recovery decision, not only a latency decision</tspan></text>
  <g id="connectors" filter="url(#glow)">
  <path id="start-latency" d="M680 270 L680 296 Q680 310 666 310 L204 310 Q190 310 190 324 L190 390" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/>
  <path id="start-sql" d="M740 270 L740 311 Q740 325 726 325 L509 325 Q495 325 495 339 L495 390" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <path id="start-doc" d="M800 270 V390" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path id="start-control" d="M860 270 L860 336 Q860 350 874 350 L1091 350 Q1105 350 1105 364 L1105 390" fill="none" stroke="#f6c96b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <path id="start-cluster" d="M920 270 L920 311 Q920 325 934 325 L1396 325 Q1410 325 1410 339 L1410 390" fill="none" stroke="#fda4af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose)"/>
</g>
<g filter="url(#shadow)">
  <rect class="card" x="430" y="175" width="740" height="95" rx="22" fill="#172033" stroke="#c4b5fd" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#c4b5fd"><tspan x="800" y="218">What infrastructure already owns coordination?</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="255">prefer the system your operators can observe and recover</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="70" y="390" width="240" height="210" rx="22" fill="#172033" stroke="#9ed8ff" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#9ed8ff"><tspan x="190" y="433">Redis</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="190" y="470">Lettuce: explicit APIs</tspan><tspan x="190" y="495">Redisson: watchdog</tspan><tspan x="190" y="520">low-latency TTL locks</tspan><tspan x="190" y="545">STABLE</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="375" y="390" width="240" height="210" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="495" y="433">Exposed SQL</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="495" y="470">JDBC or R2DBC</tspan><tspan x="495" y="495">database server time</tspan><tspan x="495" y="520">schema + transactions</tspan><tspan x="495" y="545">STABLE</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="680" y="390" width="240" height="210" rx="22" fill="#172033" stroke="#c4b5fd" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#c4b5fd"><tspan x="800" y="433">Document</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="470">MongoDB: stable</tspan><tspan x="800" y="495">DynamoDB: preview</tspan><tspan x="800" y="520">conditional ownership</tspan><tspan x="800" y="545">logical expiry</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="985" y="390" width="240" height="210" rx="22" fill="#172033" stroke="#f6c96b" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#f6c96b"><tspan x="1105" y="433">Control plane</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1105" y="470">etcd / Consul / K8s</tspan><tspan x="1105" y="495">native lease semantics</tspan><tspan x="1105" y="520">operator credentials</tspan><tspan x="1105" y="545">PREVIEW</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="1290" y="390" width="240" height="210" rx="22" fill="#172033" stroke="#fda4af" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#fda4af"><tspan x="1410" y="433">Cluster</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1410" y="470">Hazelcast IMap</tspan><tspan x="1410" y="495">ZooKeeper Curator</tspan><tspan x="1410" y="520">membership/session</tspan><tspan x="1410" y="545">STABLE</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="125" y="680" width="420" height="165" rx="22" fill="#172033" stroke="#9ed8ff" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#9ed8ff"><tspan x="335" y="723">Compare semantics</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="335" y="760">atomic acquire / owner token</tspan><tspan x="335" y="785">time source / lease renewal</tspan><tspan x="335" y="810">unlock safety / group slots</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="590" y="680" width="420" height="165" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="800" y="723">Compare operations</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="760">credentials / topology</tspan><tspan x="800" y="785">monitoring / outage behavior</tspan><tspan x="800" y="810">clock assumptions / cleanup</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect class="card" x="1055" y="680" width="420" height="165" rx="22" fill="#172033" stroke="#f6c96b" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#f6c96b"><tspan x="1265" y="723">Prove with a workshop</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1265" y="760">run the matching example</tspan><tspan x="1265" y="785">observe contention and expiry</tspan><tspan x="1265" y="810">verify recovery and metrics</tspan></text>
</g>

<g id="comparison-flow" filter="url(#glow)">
  <path id="semantics-ops" d="M545 762 H590" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/>
  <path id="ops-proof" d="M1010 762 H1055" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
</g>
<text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="500" fill="#91a4bb"><tspan x="800" y="935">preview means the API exists in 0.4, but the operational contract is still intentionally narrower</tspan></text>

</svg>
