<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Framework Convenience Must Preserve Ownership</title><desc id="desc">Flow from application triggers through Spring or Ktor to an elector, backend, release gate, and Micrometer observations.</desc>
  <defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.58" stop-color="#152235"/><stop offset="1" stop-color="#213149"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.38"/></filter>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.2"/></filter>
  <marker id="arrow-cyan" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#5eead4" stroke="#5eead4"/>
</marker>
<marker id="arrow-purple" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#c4b5fd" stroke="#c4b5fd"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#f6c96b" stroke="#f6c96b"/>
</marker>
<marker id="arrow-rose" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L14 7 L0 14 Z" fill="#fda4af" stroke="#fda4af"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="url(#canvas)"/>
  <rect x="42" y="34" width="1516" height="972" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="48" font-weight="700" fill="#f8fafc"><tspan x="800" y="96">Framework Convenience Must Preserve Ownership</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#b6c4d6"><tspan x="800" y="137">Spring Boot and Ktor converge on the same elector, backend, and observability contracts</tspan></text>
  <g id="connectors" filter="url(#glow)">
  <path id="trigger-spring" d="M800 285 V335 H390 V390" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/>
  <path id="trigger-ktor" d="M800 285 V335 H1210 V390" fill="none" stroke="#f6c96b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <path id="spring-elector" d="M390 540 V590 H800 V635" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/>
  <path id="ktor-elector" d="M1210 540 V590 H800 V635" fill="none" stroke="#f6c96b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <path id="elector-backend" d="M800 755 V800 H360 V845" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <path id="elector-events" d="M800 755 V800 H1240 V845" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path id="events-metrics" d="M1240 930 H1040" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path id="backend-release" d="M360 930 H560" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
</g>
<g filter="url(#shadow)">
  <rect x="500" y="180" width="600" height="105" rx="22" fill="#172033" stroke="#c4b5fd" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#c4b5fd"><tspan x="800" y="223">Application-owned trigger</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="260">scheduled job / request-independent background task</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="170" y="390" width="440" height="150" rx="22" fill="#172033" stroke="#9ed8ff" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#9ed8ff"><tspan x="390" y="433">Spring Boot</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="390" y="470">auto-configuration + CTW aspect</tspan><tspan x="390" y="495">annotations / SpEL / health</tspan><tspan x="390" y="520">private methods are not intercepted</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="990" y="390" width="440" height="150" rx="22" fill="#172033" stroke="#f6c96b" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#f6c96b"><tspan x="1210" y="433">Ktor</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1210" y="470">LeaderElection plugin</tspan><tspan x="1210" y="495">leaderScheduled suspend action</tspan><tspan x="1210" y="520">management registry + lifecycle</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="520" y="635" width="560" height="120" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="800" y="678">LeaderElector boundary</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="715">Elected / Skipped / ActionFailed</tspan><tspan x="800" y="740">cancellation and lease ownership remain explicit</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="120" y="845" width="480" height="115" rx="22" fill="#172033" stroke="#5eead4" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#5eead4"><tspan x="360" y="888">Selected backend</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="360" y="925">atomic acquire / renew / release</tspan><tspan x="360" y="950">resource lifecycle belongs to the application</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="620" y="845" width="360" height="115" rx="22" fill="#172033" stroke="#fda4af" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#fda4af"><tspan x="800" y="888">Release gate</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="800" y="925">finally + owner token</tspan><tspan x="800" y="950">stop extender before unlock</tspan></text>
</g>

<g filter="url(#shadow)">
  <rect x="1000" y="845" width="480" height="115" rx="22" fill="#172033" stroke="#c4b5fd" stroke-width="4"/>
  
  <text text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" font-weight="700" fill="#c4b5fd"><tspan x="1240" y="888">Events and Micrometer</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#b6c4d6"><tspan x="1240" y="925">state / listener / history</tspan><tspan x="1240" y="950">meters, health, dashboards, alerts</tspan></text>
</g>


</svg>
