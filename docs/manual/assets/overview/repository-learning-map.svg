<text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="500" fill="#91a4bb"><tspan x="800" y="955">manual path: choose -&gt; run -&gt; observe -&gt; diagnose -&gt; operate</tspan></text>

