    <text class="msg" x="1016.5" y="856.0" text-anchor="start" fill="#b86868">concurrent runIfLeader</text>
  </g>
  <path class="callRed" d="M 1465 880 L 540 880"/>
  <g>
    <rect class="label" x="1017.0" y="906.0" width="230" height="34" rx="17" stroke="#b86868" fill="#ffffff"/>
    <circle cx="1039.0" cy="923.0" r="13" fill="#fbfcf8" stroke="#b86868" stroke-width="1.8"/>
