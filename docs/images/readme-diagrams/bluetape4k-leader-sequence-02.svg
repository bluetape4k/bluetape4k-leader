  <g>
    <rect class="label" x="551.0" y="408.0" width="230" height="34" rx="17" stroke="#5b8f43" fill="#ffffff"/>
    <circle cx="573.0" cy="425.0" r="13" fill="#fbfcf8" stroke="#5b8f43" stroke-width="1.8"/>
