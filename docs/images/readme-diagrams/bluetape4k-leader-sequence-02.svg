    <text class="msg" x="684.0" y="548.0" text-anchor="start" fill="#5b8f43">execute action()</text>
  </g>
  <path class="callGreen" d="M 540 572 L 1180 572"/>
  <g>
    <rect class="label" x="701.0" y="600.0" width="230" height="34" rx="17" stroke="#a87332" fill="#ffffff"/>
