    <circle cx="204.0" cy="283.0" r="13" fill="#fbfcf8" stroke="#2f7fa7" stroke-width="1.8"/>
    <text class="badgeText" x="204.0" y="287.0" text-anchor="middle">1</text>
    <text class="msg" x="225.0" y="288.0" text-anchor="start" fill="#2f7fa7">runIfLeader(lock)</text>
  </g>
  <path class="callBlue" d="M 210 312 L 540 312"/>
  <g>
    <rect class="label" x="551.0" y="336.0" width="250" height="34" rx="17" stroke="#a87332" fill="#ffffff"/>
    <circle cx="573.0" cy="353.0" r="13" fill="#fbfcf8" stroke="#a87332" stroke-width="1.8"/>
    <text class="badgeText" x="573.0" y="357.0" text-anchor="middle">2</text>
    <text class="msg" x="594.0" y="358.0" text-anchor="start" fill="#a87332">try acquire owner</text>
  </g>
