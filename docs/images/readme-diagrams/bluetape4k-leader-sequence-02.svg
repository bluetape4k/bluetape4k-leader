    <circle cx="577.5" cy="695.0" r="13" fill="#fbfcf8" stroke="#a87332" stroke-width="1.8"/>
    <text class="badgeText" x="577.5" y="699.0" text-anchor="middle">6</text>
    <text class="msg" x="598.5" y="700.0" text-anchor="start" fill="#a87332">release lock</text>
  </g>
  <path class="callAmber" d="M 540 724 L 850 724"/>
  <g>
    <rect class="label" x="204.5" y="750.0" width="225" height="34" rx="17" stroke="#2f7fa7" fill="#ffffff"/>
