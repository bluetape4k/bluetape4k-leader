  <rect class="canvas" width="1600" height="1120"/>
  <rect class="frame" x="24" y="24" width="1552" height="1072" rx="20"/>
  <text class="title" x="800" y="78" text-anchor="middle">How runIfLeader Works</text>
  <text class="subtitle" x="800" y="112" text-anchor="middle">Only the elected caller runs the action; contenders receive null or LeaderRunResult.Skipped.</text>

  <g>
    <rect class="header" x="90" y="160" width="210" height="70" rx="10"/>
    <text class="participant-title" x="195.0" y="191" text-anchor="middle">Node A</text>
    <text class="participant-sub" x="195.0" y="215" text-anchor="middle">caller</text>
  </g>
  <g>
    <rect class="header" x="405" y="160" width="270" height="70" rx="10"/>
    <text class="participant-title" x="540.0" y="191" text-anchor="middle">LeaderElector</text>
    <text class="participant-sub" x="540.0" y="215" text-anchor="middle">single leader</text>
  </g>
  <g>
    <rect class="header" x="730" y="160" width="240" height="70" rx="10"/>
    <text class="participant-title" x="850.0" y="191" text-anchor="middle">Backend Lock</text>
    <text class="participant-sub" x="850.0" y="215" text-anchor="middle">atomic owner</text>
