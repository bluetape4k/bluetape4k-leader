    <circle cx="157.0" cy="851.0" r="13" fill="#fbfcf8" stroke="#b86868" stroke-width="1.8"/>
    <text class="badgeText" x="157.0" y="855.0" text-anchor="middle">else</text>
    <text class="msg" x="187.0" y="856.0" text-anchor="start" fill="#b86868">else lock already held</text>
