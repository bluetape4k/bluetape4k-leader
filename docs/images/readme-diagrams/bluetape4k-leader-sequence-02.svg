  <path class="retRed" d="M 540 952 L 1465 952"/>
  <rect x="100" y="1024" width="1400" height="42" rx="12" fill="#ffffff" stroke="#cfdde3" stroke-width="1.8"/>
  <text class="note" x="118" y="1050" text-anchor="start">Action exceptions propagate, cancellation is not wrapped, and contention is represented as skip/null.</text>
  <text class="footer" x="800" y="1090" text-anchor="middle">github.com/bluetape4k/bluetape4k-leader - bluetape4k-leader-sequence-02</text>
