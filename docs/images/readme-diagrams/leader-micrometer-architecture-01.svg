<svg xmlns="http://www.w3.org/2000/svg" width="1846" height="1120" viewBox="0 0 1846 1120" role="img" aria-labelledby="title desc">
  <title id="title">leader-micrometer instrumentation architecture</title>
  <desc id="desc">Architecture diagram showing leader metric paths and Observation tracing bridge paths. Metrics flow to MeterRegistry, while Observations flow to ObservationRegistry and optional application-owned tracing export.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f62" stroke="#5f8f62" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b1793d" stroke="#b1793d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-rose" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-slate" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f7f8a" stroke="#6f7f8a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #f8faf7; }
      .frame { fill: #ffffff; stroke: #c9d5df; stroke-width: 2.2; rx: 24; }
      .title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 42px; fill: #1f3138; font-weight: 400; }
      .subtitle { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 17px; fill: #52636f; }
      .lane-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 25px; fill: #1f3138; font-weight: 400; }
      .section-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 22px; fill: #1f3138; font-weight: 400; }
      .card { stroke-width: 2.1; rx: 12; }
      .input { fill: #edf5ff; stroke: #4f86c6; }
      .adapter { fill: #eef8ed; stroke: #5f8f62; }
      .meter { fill: #fff1dc; stroke: #b1793d; }
      .observation { fill: #fff4f4; stroke: #b86868; }
      .registry { fill: #f0ecfb; stroke: #8170b6; }
      .export { fill: #f1f5f7; stroke: #6f7f8a; }
      .guard { fill: #fceaf2; stroke: #b65f8e; }
      .card-title { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 15px; fill: #1f3138; font-weight: 700; }
      .small-title { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 14px; fill: #1f3138; font-weight: 700; }
      .body { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 12px; fill: #52636f; }
      .caption { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 11px; fill: #6f7f8a; }
      .legend { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 12px; fill: #52636f; }
      .route-blue { fill: none; stroke: #4f86c6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .route-green { fill: none; stroke: #5f8f62; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .route-amber { fill: none; stroke: #b1793d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .route-rose { fill: none; stroke: #b86868; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-rose); }
      .route-slate { fill: none; stroke: #6f7f8a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; marker-end: url(#arrow-slate); }
      .sep { stroke: rgba(31, 49, 56, 0.18); stroke-width: 1; }
      .flow-label { fill: #ffffff; stroke: #d4dee6; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect class="canvas" width="1846" height="1120"/>
  <rect class="frame" x="40" y="32" width="1766" height="1034"/>
  <text class="title" x="923" y="88" text-anchor="middle">leader-micrometer Instrumentation Architecture</text>
  <text class="subtitle" x="923" y="122" text-anchor="middle">Metrics and Observations are separate side effects; trace export is application-owned.</text>

  <text class="lane-title" x="150" y="174">Inputs</text>
  <text class="lane-title" x="468" y="174">Adapters</text>
  <text class="lane-title" x="824" y="174">Signals</text>
  <text class="lane-title" x="1286" y="174">Registries</text>
  <text class="lane-title" x="1565" y="174">Export</text>

  <g id="inputs">
    <rect class="card input" x="86" y="206" width="270" height="92"/>
    <text class="card-title" x="221" y="235" text-anchor="middle">Spring AOP callbacks</text>
    <line class="sep" x1="86" y1="250" x2="356" y2="250"/>
    <text class="body" x="110" y="272">@LeaderElection aspect</text>
    <text class="body" x="110" y="291">attempt/acquired/skipped</text>

    <rect class="card input" x="86" y="338" width="270" height="92"/>
    <text class="card-title" x="221" y="367" text-anchor="middle">AOP terminal callbacks</text>
    <line class="sep" x1="86" y1="382" x2="356" y2="382"/>
    <text class="body" x="110" y="404">acquired / skipped / success</text>
    <text class="body" x="110" y="423">failure / cancellation</text>

    <rect class="card input" x="86" y="470" width="270" height="92"/>
    <text class="card-title" x="221" y="499" text-anchor="middle">Direct elector calls</text>
    <line class="sep" x1="86" y1="514" x2="356" y2="514"/>
    <text class="body" x="110" y="536">LeaderElector decorators</text>
    <text class="body" x="110" y="555">sync / async / suspend</text>

    <rect class="card input" x="86" y="602" width="270" height="92"/>
    <text class="card-title" x="221" y="631" text-anchor="middle">Lifecycle callbacks</text>
    <line class="sep" x1="86" y1="646" x2="356" y2="646"/>
    <text class="body" x="110" y="668">LeaderElectionListener</text>
    <text class="body" x="110" y="687">elected / revoked / skipped</text>

    <rect class="card input" x="86" y="734" width="270" height="92"/>
    <text class="card-title" x="221" y="763" text-anchor="middle">History sinks</text>
    <line class="sep" x1="86" y1="778" x2="356" y2="778"/>
    <text class="body" x="110" y="800">LeaderHistorySink</text>
    <text class="body" x="110" y="819">recordAcquired/completed</text>
  </g>

  <g id="adapters">
    <rect class="card adapter" x="420" y="206" width="330" height="92"/>
    <text class="card-title" x="585" y="235" text-anchor="middle">MicrometerLeaderAopMetricsRecorder</text>
    <line class="sep" x1="420" y1="250" x2="750" y2="250"/>
    <text class="body" x="444" y="272">implements LeaderAopMetricsRecorder</text>
    <text class="body" x="444" y="291">pre-register / deregister lock names</text>

    <rect class="card adapter" x="420" y="338" width="330" height="92"/>
    <text class="card-title" x="585" y="367" text-anchor="middle">Observation Recorder / Listener</text>
    <line class="sep" x1="420" y1="382" x2="750" y2="382"/>
    <text class="body" x="444" y="404">terminal standalone observations</text>
    <text class="body" x="444" y="423">no current scope around method body</text>

    <rect class="card adapter" x="420" y="470" width="330" height="92"/>
    <text class="card-title" x="585" y="499" text-anchor="middle">Instrumented Elector Decorators</text>
    <line class="sep" x1="420" y1="514" x2="750" y2="514"/>
    <text class="body" x="444" y="536">wrap delegate behavior unchanged</text>
    <text class="body" x="444" y="555">fixed or per-call lock.name tag</text>

    <rect class="card adapter" x="420" y="602" width="330" height="92"/>
    <text class="card-title" x="585" y="631" text-anchor="middle">MicrometerLeaderElectionListener</text>
    <line class="sep" x1="420" y1="646" x2="750" y2="646"/>
    <text class="body" x="444" y="668">counter cache by lock/event</text>
    <text class="body" x="444" y="687">optional Observation listener too</text>

    <rect class="card adapter" x="420" y="734" width="330" height="92"/>
    <text class="card-title" x="585" y="763" text-anchor="middle">CounterAware Sink Decorators</text>
    <line class="sep" x1="420" y1="778" x2="750" y2="778"/>
    <text class="body" x="444" y="800">sync and suspend variants</text>
    <text class="body" x="444" y="819">cancellation is not counted</text>
  </g>

  <g id="signals">
    <rect class="card meter" x="812" y="206" width="336" height="92"/>
    <text class="small-title" x="980" y="234" text-anchor="middle">leader.aop.* meters</text>
    <line class="sep" x1="812" y1="250" x2="1148" y2="250"/>
    <text class="body" x="836" y="272">attempts, acquired, not_acquired</text>
    <text class="body" x="836" y="291">duration, failed, active gauge</text>

    <rect class="card observation" x="812" y="338" width="336" height="92"/>
    <text class="small-title" x="980" y="366" text-anchor="middle">leader.aop.* observations</text>
    <line class="sep" x1="812" y1="382" x2="1148" y2="382"/>
    <text class="body" x="836" y="404">leader.aop.acquire / execution</text>
    <text class="body" x="836" y="423">outcome, reason, exception class</text>

    <rect class="card meter" x="812" y="470" width="336" height="92"/>
    <text class="small-title" x="980" y="498" text-anchor="middle">shedlock.leader.* meters</text>
    <line class="sep" x1="812" y1="514" x2="1148" y2="514"/>
    <text class="body" x="836" y="536">acquired, not_acquired</text>
    <text class="body" x="836" y="555">duration, active gauge</text>

    <rect class="card meter" x="812" y="602" width="336" height="92"/>
    <text class="small-title" x="980" y="630" text-anchor="middle">leader.election.events</text>
    <line class="sep" x1="812" y1="646" x2="1148" y2="646"/>
    <text class="body" x="836" y="668">counter tags: lock.name, event</text>
    <text class="body" x="836" y="687">observation: leader.election.event</text>

    <rect class="card meter" x="812" y="734" width="336" height="92"/>
    <text class="small-title" x="980" y="762" text-anchor="middle">leader.history.* meters</text>
    <line class="sep" x1="812" y1="778" x2="1148" y2="778"/>
    <text class="body" x="836" y="800">sink.failures</text>
    <text class="body" x="836" y="819">acquire.missing</text>
  </g>

  <g id="registry">
    <rect class="card registry" x="1510" y="206" width="250" height="620"/>
    <text class="card-title" x="1635" y="247" text-anchor="middle">MeterRegistry</text>
    <line class="sep" x1="1510" y1="264" x2="1760" y2="264"/>
    <text class="body" x="1534" y="292">Counter / Timer / Gauge</text>
    <text class="body" x="1534" y="314">Micrometer naming convention</text>
    <text class="body" x="1534" y="336">application-owned backend</text>
    <text class="body" x="1534" y="392">All meter families stay separate</text>
    <text class="body" x="1534" y="414">from Observation handlers.</text>

    <rect class="card registry" x="1220" y="338" width="250" height="150"/>
    <text class="card-title" x="1345" y="369" text-anchor="middle">ObservationRegistry</text>
    <line class="sep" x1="1220" y1="386" x2="1470" y2="386"/>
    <text class="body" x="1244" y="410">ObservationHandler chain</text>
    <text class="body" x="1244" y="430">application tracing bridge</text>
    <text class="body" x="1244" y="450">optional exporter</text>
    <text class="body" x="1244" y="470">no method-body scope</text>

    <rect class="card export" x="1510" y="880" width="250" height="110"/>
    <text class="card-title" x="1635" y="911" text-anchor="middle">Metric Backends</text>
    <line class="sep" x1="1510" y1="928" x2="1760" y2="928"/>
    <text class="body" x="1534" y="952">Prometheus / Datadog</text>
    <text class="body" x="1534" y="972">composite registries</text>
  </g>

  <g id="guards">
    <rect class="card guard" x="320" y="886" width="960" height="112"/>
    <text class="card-title" x="800" y="918" text-anchor="middle">Operational Guardrails</text>
    <text class="body" x="352" y="944">Keep `lock.name`, `leader.id`, and exception details disabled unless the tracing backend may receive raw values.</text>
    <text class="body" x="352" y="966">Metric export and trace export are opt-in application concerns; this module does not add an OTel SDK, exporter, or collector.</text>
    <text class="body" x="352" y="988">Lease-extension observations are deferred until leader-core exposes a LockExtender observation hook.</text>
  </g>

  <path class="route route-blue" d="M 356 252 L 420 252"/>
  <path class="route route-rose" d="M 356 384 L 420 384"/>
  <path class="route route-green" d="M 356 516 L 420 516"/>
  <path class="route route-amber" d="M 356 648 L 420 648"/>
  <path class="route route-amber" d="M 356 780 L 420 780"/>

  <path class="route route-blue" d="M 750 252 L 812 252"/>
  <path class="route route-rose" d="M 750 384 L 812 384"/>
  <path class="route route-green" d="M 750 516 L 812 516"/>
  <path class="route route-amber" d="M 750 648 L 812 648"/>
  <path class="route route-amber" d="M 750 780 L 812 780"/>

  <path class="route route-blue" d="M 1148 252 L 1510 252"/>
  <path class="route route-rose" d="M 1148 384 L 1220 384"/>
  <path class="route route-green" d="M 1148 516 L 1510 516"/>
  <path class="route route-amber" d="M 1148 648 L 1510 648"/>
  <path class="route route-amber" d="M 1148 780 L 1510 780"/>

  <path class="route route-blue" d="M 1635 826 L 1635 880"/>

  <g id="legend">
    <rect x="92" y="916" width="184" height="70" rx="12" fill="#f7fbff" stroke="#d4dee6" stroke-width="1.4"/>
    <text class="section-title" x="184" y="944" text-anchor="middle">Legend</text>
    <line x1="112" y1="962" x2="158" y2="962" class="route route-blue"/>
    <text class="legend" x="174" y="966">metrics path</text>
    <line x1="112" y1="982" x2="158" y2="982" class="route route-rose"/>
    <text class="legend" x="174" y="986">observation path</text>
  </g>

  <text class="caption" x="96" y="1040">Source contract: instrumentation is side effect only; leader election behavior remains owned by leader-core and backend electors.</text>
  <text class="caption" x="1750" y="1040" text-anchor="end">github.com/bluetape4k/bluetape4k-leader</text>
</svg>
